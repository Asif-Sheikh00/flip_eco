version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    working_dir: /var/www
    user: www-data
    command: >
      /bin/sh -c "chown -R www-data:www-data database storage bootstrap/cache && if [ ! -f /var/www/database/database.sqlite ]; then touch /var/www/database/database.sqlite; fi && php-fpm"
    networks:
      - my_network

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - my_network

networks:
  my_network:
